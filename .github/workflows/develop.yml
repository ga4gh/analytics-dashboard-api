name: develop branch workflow

on:
  push:
    branches:
      - main
      - develop
      - dc-deployment-pipeline
permissions:
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: save command output
        run: |
          echo "DOCKER_REPO=analytics-dashboard-api" >> $GITHUB_ENV
          echo "DOCKER_TAG=$(git describe --tags)" >> $GITHUB_ENV

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build app docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:develop \
            .

      - name: build liquibase docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}-liquibase:${{ env.DOCKER_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}-liquibase:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}-liquibase:develop \
            liquibase
