AWSTemplateFormatVersion: 2010-09-09
Description: Template for Analytics Dashboard UI deployment on AWS ECS Fargate with NLB

Parameters:
  StaticStackName:
    Type: String
    Default: analytics-dashboard
  UIPort:
    Type: String
    Default: 8050
  FrontEndImage:
    Type: String
    Default: 282236276875.dkr.ecr.us-east-2.amazonaws.com/analytics-dashboard-ui:latest
  ApiBaseUrl:
    Type: String
    Default: http://AnalyticsDashboardAlbBalancer-1386294349.us-east-2.elb.amazonaws.com:8000
  VpcId:
    Type: String
    Default: vpc-0d772394df78b1311
  SubnetA:
    Type: String
    Default: subnet-0be7a1fb3a96191b4
  SubnetB:
    Type: String
    Default: subnet-0c465ec61b98bffac
  SubnetC:
    Type: String
    Default: subnet-07b0e79f4d9bbf9d0
  AnalyticsLG:
    Type: String
    Default: AnalyticsLG
  Region:
    Type: String
    Default: us-east-2
  Prefix:
    Type: String
    Default: ecs
  ExecutionRole:
    Type: String
    Default: arn:aws:iam::282236276875:role/ECSFargateExecutionRole-TT
  DevelopmentEnvironment:
    Type: String
    Default: Development
  BasePort:
    Type: String
    Default: 8050
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-2:282236276875:certificate/ae6d656e-a776-4391-932c-24b3aa4d0c4c

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP/HTTPS to ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8050
          ToPort: 8050
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: AnalyticsDashboardNEWFEALB
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - Ref: SubnetA
        - Ref: SubnetB
        - Ref: SubnetC

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: AnalyticsNEWFETargetGroup
      TargetType: ip
      Protocol: HTTP
      Port: !Ref UIPort
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-399

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - ALB
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - TargetGroup
      - ALB
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: analytics-new-ui-cluster

  ECSTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to reach ECS tasks on Dash port
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8050
          ToPort: 8050
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ECSFrontEndService:
    Type: AWS::ECS::Service
    DependsOn:
      - ECSFrontEndTaskDefinition
      - ALBListenerHTTPS
      - TargetGroup
    Properties:
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      ServiceName: analytics-new-fe-service
      TaskDefinition: !Ref ECSFrontEndTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !ImportValue
              Fn::Sub: ${StaticStackName}-SGId
            - !Ref ECSTaskSecurityGroup
          Subnets:
            - !Ref SubnetA
            - !Ref SubnetB
            - !Ref SubnetC
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: analytics-new-ui-container
          ContainerPort: !Ref UIPort

  ECSFrontEndTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: 1024
      Memory: 4096
      NetworkMode: awsvpc
      ExecutionRoleArn: !Ref ExecutionRole
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: analytics-new-ui-container
          Image: !Ref FrontEndImage
          Environment:
            - Name: GA4GH_ANALYTICS_DASHBOARD_API_BASE_URL
              Value: !Ref ApiBaseUrl
            - Name: GA4GH_ANALYTICS_DASHBOARD_UI_PORT
              Value: !Ref UIPort
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AnalyticsLG
              awslogs-region: !Ref Region
              awslogs-stream-prefix: !Ref Prefix

          PortMappings:
            - ContainerPort: !Ref UIPort

Outputs:
  ALBDNSName:
    Description: DNS name of the ALB (use this in CNAME record)
    Value: !GetAtt ALB.DNSName
